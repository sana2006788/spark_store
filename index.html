      const addToCart = (product, qty = 1, mode = 'retail') => {
        const effectiveMode = (product.channel === 'wholesale' && (mode === 'wholesale' || qty >= product.minBulkQty))
          ? 'wholesale'
          : 'retail';
        setCart(prev => {
          const idx = prev.findIndex(item => item.productId === product.id);
          if (idx > -1) {
            const updated = [...prev];
            const newQty = updated[idx].qty + qty;
            updated[idx] = {
              ...updated[idx],
              qty: newQty,
              mode: (product.channel === 'wholesale' && newQty >= product.minBulkQty) ? 'wholesale' : updated[idx].mode
            };
            return updated;
          }
          return [...prev, { productId: product.id, qty, mode: effectiveMode }];
        });
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => prev.map(item => {
          if (item.productId !== productId) return item;
          const prod = products.find(p => p.id === productId);
          const nextQty = Math.max(0, item.qty + delta);
          if (nextQty === 0) return null;
          const nextMode = (prod && prod.channel === 'wholesale' && nextQty >= prod.minBulkQty) ? 'wholesale' : 'retail';
          return { ...item, qty: nextQty, mode: nextMode };
        }).filter(Boolean));
      };

      const cartDetailed = useMemo(() => {
        return cart.map(item => {
          const prod = products.find(p => p.id === item.productId);
          if (!prod) return null;
          const isBulk = prod.channel === 'wholesale' && (item.mode === 'wholesale' || item.qty >= prod.minBulkQty);
          const unitPrice = isBulk ? prod.wholesalePrice : prod.retailPrice;
          const retailTotal = prod.retailPrice * item.qty;
          const finalTotal = unitPrice * item.qty;
          return {
            ...item,
            product: prod,
            isBulk,
            unitPrice,
            retailTotal,
            finalTotal,
            saved: retailTotal - finalTotal
          };
        }).filter(Boolean);
      }, [cart, products]);

      const totals = useMemo(() => {
        const subtotal = cartDetailed.reduce((acc, i) => acc + i.finalTotal, 0);
        const wholesaleSavings = cartDetailed.reduce((acc, i) => acc + i.saved, 0);
        const firstOrderDiscount = (firstOrderPromo && subtotal >= 500) ? 150 : 0;
        const deliveryFee = subtotal > 999 || subtotal === 0 ? 0 : 29;
        const grandTotal = Math.max(0, subtotal - firstOrderDiscount + deliveryFee);
        return { subtotal, wholesaleSavings, firstOrderDiscount, deliveryFee, grandTotal };
      }, [cartDetailed, firstOrderPromo]);

      const filteredProducts = useMemo(() => {
        let list = products.filter(p => {
          if (step === 2 && p.channel !== 'retail' && categoryFilter === 'All') {
            // In Step 2 Retail Store, show retail electronics + retail-packed produce
          }
          if (step === 3 && p.channel !== 'wholesale') return false;
          if (categoryFilter !== 'All' && p.category !== categoryFilter) return false;
          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase();

                    <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                      <button
                        onClick={() => setStep(step - 1)}
                        className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-50"
                      >
                        ← Previous Step
                      </button>
                      <button
                        onClick={() => setStep(step + 1)}
                        className="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow"
                      >
                        {step === 2 ? 'Next: Wholesale 50% Bulk Store →' : 'Next: Customer Delivery Details →'}
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 4: CUSTOMER DETAILS & CART EDITOR */}
                {step === 4 && (
                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                      <span className="text-xs font-bold text-emerald-700 uppercase">Step 4 of 7 • Delivery &amp; Hub Routing</span>
                      <h2 className="text-xl font-extrabold text-slate-900">Customer &amp; Chennai Delivery Details</h2>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
                          <input
                            type="text"
                            value={customer.fullName}
                            onChange={e => setCustomer({ ...customer, fullName: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
                          <input
                            type="text"
                            value={customer.phone}
                            onChange={e => setCustomer({ ...customer, phone: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm"
                          />
                        </div>
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Chennai Street Address</label>
                          <input
                            type="text"
                            value={customer.address}
                            onChange={e => setCustomer({ ...customer, address: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">PIN Code</label>
                          <input
                            type="text"
                            value={customer.pincode}
                            onChange={e => setCustomer({ ...customer, pincode: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-600 mb-1">Delivery Window</label>
                          <select
                            value={customer.deliverySlot}
                            onChange={e => setCustomer({ ...customer, deliverySlot: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm bg-white"
                          >
                            <option>Instant Express (12–18 mins)</option>
                            <option>Morning Harvest Slot (6:30 AM – 8:30 AM)</option>
                            <option>Evening Kitchen Slot (5:30 PM – 7:30 PM)</option>
                          </select>
                        </div>
                      </div>

                      <div className="pt-4 flex justify-between">
                        <button
                          onClick={() => setStep(3)}
                          className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold"
                        >
                          ← Back to Catalog
                        </button>
                        <button
                          onClick={() => setStep(5)}
                          disabled={cartDetailed.length === 0}
                          className="px-5 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 disabled:opacity-50 text-white text-xs font-bold shadow"
                        >
                          Continue to Payment →
                        </button>
                      </div>
                    </div>

                    {/* CART SUMMARY */}
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                      <h3 className="font-bold text-slate-900">Your Basket ({cartDetailed.length} items)</h3>
                      {cartDetailed.length === 0 ? (
                        <p className="text-xs text-slate-500">Your basket is empty. Add produce from Step 2 or 3.</p>
                      ) : (
                        <div className="space-y-3 max-h-72 overflow-y-auto pr-1">
                          {cartDetailed.map(item => (
                            <div key={item.productId} className="flex items-center justify-between gap-2 border-b border-slate-100 pb-2">
                              <div className="flex items-center gap-2.5">
                                <img src={item.product.image} alt="" className="w-10 h-10 rounded-lg object-cover" />
                                <div>
                                  <div className="text-xs font-bold text-slate-800">{item.product.name}</div>
                                  <div className="text-[11px] text-emerald-700 font-semibold">
                                    {formatINR(item.unitPrice)} × {item.qty} {item.isBulk ? '(50% Bulk)' : ''}
                                  </div>
                                </div>
                              </div>
                              <div className="flex items-center gap-1.5">
                                <button onClick={() => updateCartQty(item.productId, -1)} className="px-2 py-0.5 bg-slate-100 rounded text-xs font-bold">−</button>
                                <span className="text-xs font-bold">{item.qty}</span>
                                <button onClick={() => updateCartQty(item.productId, 1)} className="px-2 py-0.5 bg-slate-100 rounded text-xs font-bold">+</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                      <div className="space-y-1.5 text-xs pt-2 border-t border-slate-200">
                        <div className="flex justify-between"><span>Subtotal</span><span className="font-bold">{formatINR(totals.subtotal)}</span></div>
                        <div className="flex justify-between text-emerald-700"><span>Wholesale 50% Savings</span><span>−{formatINR(totals.wholesaleSavings)}</span></div>
                        <div className="flex justify-between text-amber-700"><span>First-Order Promo</span><span>−{formatINR(totals.firstOrderDiscount)}</span></div>
                        <div className="flex justify-between"><span>Cold-Chain Delivery</span><span>{totals.deliveryFee === 0 ? 'FREE' : formatINR(totals.deliveryFee)}</span></div>
                        <div className="flex justify-between text-base font-extrabold text-slate-900 pt-2 border-t">
                          <span>Total Payable</span><span>{formatINR(totals.grandTotal)}</span>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* STEP 5: PAYMENT */}
                {step === 5 && (
                  <div className="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                    <span className="text-xs font-bold text-emerald-700 uppercase">Step 5 of 7 • Payment Gateway</span>
                    <h2 className="text-xl font-extrabold text-slate-900">Select Payment Mode</h2>

                    <div className="grid grid-cols-3 gap-3">
                      {['UPI', 'Card', 'COD'].map(mode => (
                        <button
                          key={mode}
                          onClick={() => setPaymentMethod(mode)}
                          className={`p-3.5 rounded-xl border text-center font-bold text-sm transition ${
                            paymentMethod === mode
                              ? 'border-emerald-700 bg-emerald-50 text-emerald-900 shadow-sm'
                              : 'border-slate-200 text-slate-600 hover:bg-slate-50'
                          }`}
                        >
                          {mode === 'UPI' ? 'UPI / GPay / PhonePe' : mode === 'Card' ? 'Credit / Debit Card' : 'Cash on Delivery'}
                        </button>
                      ))}
                    </div>

                    {paymentMethod === 'UPI' && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Enter UPI ID</label>
                        <input
                          type="text"
                          value={upiId}
                          onChange={e => setUpiId(e.target.value)}
                          className="w-full border border-slate-300 rounded-xl px-3.5 py-2 text-sm"
                        />
                      </div>
                    )}

                    <div className="bg-slate-50 p-4 rounded-xl flex justify-between items-center">
                      <span className="text-xs font-semibold text-slate-600">Net Payable Amount</span>
                      <span className="text-xl font-extrabold text-emerald-800">{formatINR(totals.grandTotal)}</span>
                    </div>

                    <div className="flex justify-between">
                      <button onClick={() => setStep(4)} className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                        ← Back
                      </button>
                      <button onClick={() => setStep(6)} className="px-5 py-2.5 rounded-xl bg-emerald-700 text-white text-xs font-bold shadow">
                        Review Final Order →
                      </button>
                    </div>
                  </div>
                )}

                {/* STEP 6: REVIEW */}
                {step === 6 && (
                  <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                    <span className="text-xs font-bold text-emerald-700 uppercase">Step 6 of 7 • Final Verification</span>
                    <h2 className="text-xl font-extrabold text-slate-900">Review Order Before Dispatch</h2>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl text-xs">
                      <div>
                        <div className="font-bold text-slate-700">Delivering To:</div>
                        <div className="text-slate-900 font-semibold mt-0.5">{customer.fullName} ({customer.phone})</div>
                        <div className="text-slate-600">{customer.address} - {customer.pincode}</div>
                      </div>
                      <div>
                        <div className="font-bold text-slate-700">Dispatch Hub &amp; Payment:</div>
                        <div className="text-emerald-800 font-semibold mt-0.5">{selectedHub.name} ({selectedHub.eta})</div>
                        <div className="text-slate-600">Payment: {paymentMethod} {paymentMethod === 'UPI' ? `(${upiId})` : ''}</div>
                      </div>
                    </div>

                    <div className="divide-y divide-slate-100">
                      {cartDetailed.map(item => (
                        <div key={item.productId} className="py-2.5 flex justify-between items-center text-xs">
                          <div>
                            <span className="font-bold text-slate-900">{item.product.name}</span>
                            <span className="text-slate-500 ml-2">× {item.qty} ({item.product.storageZone})</span>
                          </div>
                          <span className="font-bold">{formatINR(item.finalTotal)}</span>
                        </div>
                      ))}
                    </div>

                    <div className="border-t pt-3 flex justify-between items-center">
                      <div>
                        <div className="text-xs text-emerald-700 font-semibold">
                          Total Saved: {formatINR(totals.wholesaleSavings + totals.firstOrderDiscount)}
                        </div>
                        <div className="text-lg font-extrabold text-slate-900">Grand Total: {formatINR(totals.grandTotal)}</div>
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setStep(5)} className="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                          ← Edit
                        </button>
                        <button
                          onClick={handlePlaceOrder}
                          className="px-6 py-3 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-extrabold shadow-lg"
                        >
                          Confirm &amp; Dispatch Order ✓
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* STEP 7: ORDER CONFIRMATION */}
                {step === 7 && latestOrder && (
                  <div className="max-w-xl mx-auto bg-white p-7 rounded-2xl shadow-md border border-emerald-200 text-center space-y-4">
                    <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl font-extrabold mx-auto">
                      ✓
                    </div>
                    <span className="text-xs font-bold bg-emerald-50 text-emerald-800 px-3 py-1 rounded-full">
                      Step 7 of 7 • Dispatched from {latestOrder.hub}
                    </span>
                    <h2 className="text-2xl font-extrabold text-slate-900">Order Confirmed! ({latestOrder.id})</h2>
                    <p className="text-sm text-slate-600">
                      Your fresh produce &amp; grains have been picked from Cold Bins &amp; Dry Silos and assigned to an express rider.
                    </p>
                    <div className="bg-slate-50 p-4 rounded-xl text-left text-xs space-y-1.5">
                      <div><strong>Customer:</strong> {latestOrder.customer.fullName} ({latestOrder.customer.phone})</div>
                      <div><strong>Address:</strong> {latestOrder.customer.address} - {latestOrder.customer.pincode}</div>
                      <div><strong>Amount Paid:</strong> {formatINR(latestOrder.totals.grandTotal)} via {latestOrder.paymentMethod}</div>
                      <div className="text-emerald-700 font-bold">
                        You saved {formatINR(latestOrder.totals.wholesaleSavings + latestOrder.totals.firstOrderDiscount)} on this order!
                      </div>
                    </div>
                    <button
                      onClick={() => setStep(2)}
                      className="px-6 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold shadow"
                    >
                      Start New Order →
                    </button>
                  </div>
                )}
              </>
            )}
          </main>

          {/* PRODUCT QUICK-VIEW MODAL WITH ZOOM & SPECS */}
          {quickViewProduct && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl border border-slate-200 grid grid-cols-1 md:grid-cols-2">
                <div className="bg-slate-100 p-4 flex flex-col justify-between">
                  <div className="zoom-container relative h-64 rounded-xl overflow-hidden bg-white border border-slate-200 cursor-zoom-in">
                    <img
                      src={quickViewProduct.gallery[quickViewImgIdx] || quickViewProduct.image}
                      alt={quickViewProduct.name}
                      className="zoom-img w-full h-full object-cover"
                    />
                    <span className="absolute bottom-2 left-2 bg-slate-900/75 text-white text-[10px] px-2 py-0.5 rounded">
                      Hover to 1.65x Zoom
                    </span>
                  </div>
                  <div className="flex gap-2 mt-3">
                    {quickViewProduct.gallery.map((img, i) => (
                      <button
                        key={i}
                        onClick={() => setQuickViewImgIdx(i)}
                        className={`w-14 h-14 rounded-lg overflow-hidden border-2 ${
                          quickViewImgIdx === i ? 'border-emerald-600' : 'border-transparent'
                        }`}
                      >
                        <img src={img} alt="" className="w-full h-full object-cover" />
                      </button>
                    ))}
                  </div>
                </div>

                <div className="p-6 flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-start gap-2">
                      <span className="text-[11px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">
                        {quickViewProduct.category} • {selectedHub.eta} ETA
                      </span>
                      <button
                        onClick={() => setQuickViewProduct(null)}
                        className="text-slate-400 hover:text-slate-800 font-bold text-lg leading-none"
                      >
                        ✕
                      </button>
                    </div>
                    <h3 className="text-lg font-extrabold text-slate-900 mt-2">{quickViewProduct.name}</h3>
                    <div className="text-xs text-slate-500 mt-0.5">
                      ★ {quickViewProduct.rating} ({quickViewProduct.reviewsCount} reviews) • {quickViewProduct.storageZone}
                    </div>

                    {/* TABS */}
                    <div className="flex gap-2 border-b border-slate-200 mt-4 pb-2 text-xs font-bold">
                      {['highlights', 'specs', 'reviews'].map(tab => (
                        <button
                          key={tab}
                          onClick={() => setQuickViewTab(tab)}
                          className={`capitalize px-2.5 py-1 rounded-lg ${
                            quickViewTab === tab ? 'bg-emerald-700 text-white' : 'text-slate-500 hover:bg-slate-100'
                          }`}
                        >
                          {tab}
                        </button>
                      ))}
                    </div>

                    <div className="mt-3 text-xs text-slate-700 min-h-[105px]">
                      {quickViewTab === 'highlights' && (
                        <ul className="list-disc pl-4 space-y-1.5">
                          {quickViewProduct.highlights.map((h, i) => <li key={i}>{h}</li>)}
                        </ul>
                      )}
                      {quickViewTab === 'specs' && (
                        <div className="grid grid-cols-2 gap-2">
                          {Object.entries(quickViewProduct.specs).map(([k, v]) => (
                            <div key={k} className="bg-slate-50 p-2 rounded-lg">
                              <div className="text-[10px] text-slate-400 uppercase">{k}</div>
                              <div className="font-bold text-slate-800">{v}</div>
                            </div>
                          ))}
                        </div>
                      )}
                      {quickViewTab === 'reviews' && (
                        <div className="space-y-2">
                          {quickViewProduct.reviews.map((r, i) => (
                            <div key={i} className="bg-slate-50 p-2.5 rounded-lg">
                              <div className="font-bold text-slate-900">{r.user} • ★ {r.rating}</div>
                              <p className="text-slate-600 mt-0.5">{r.comment}</p>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>

                  {/* QUANTITY & DYNAMIC BULK CALCULATOR */}
                  <div className="pt-4 border-t border-slate-200 mt-4 space-y-3">
                    <div className="flex items-center justify-between">
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setQuickViewQty(Math.max(1, quickViewQty - 1))}
                          className="w-8 h-8 rounded-lg bg-slate-100 font-bold"
                        >
                          −
                        </button>
                        <span className="text-sm font-extrabold w-6 text-center">{quickViewQty}</span>
                        <button
                          onClick={() => setQuickViewQty(quickViewQty + 1)}
                          className="w-8 h-8 rounded-lg bg-slate-100 font-bold"
                        >
                          +
                        </button>
                      </div>
                      <div className="text-right">
                        {(() => {
                          const isBulk = quickViewProduct.channel === 'wholesale' && quickViewQty >= quickViewProduct.minBulkQty;
                          const unit = isBulk ? quickViewProduct.wholesalePrice : quickViewProduct.retailPrice;
                          return (
                            <>
                              <div className="text-lg font-extrabold text-emerald-800">{formatINR(unit * quickViewQty)}</div>
                              <div className="text-[11px] text-slate-500">
                                {isBulk
                                  ? `50% Wholesale Applied (${formatINR(unit)}/unit)`
                                  : quickViewProduct.channel === 'wholesale'
                                  ? `Add ${quickViewProduct.minBulkQty - quickViewQty} more for 50% OFF`
                                  : 'Retail Express Price'}
                              </div>
                            </>
                          );
                        })()}
                      </div>
                    </div>

                    <button
                      onClick={() => {
                        const mode = (quickViewProduct.channel === 'wholesale' && quickViewQty >= quickViewProduct.minBulkQty)
                          ? 'wholesale'
                          : 'retail';
                        addToCart(quickViewProduct, quickViewQty, mode);
                        setQuickViewProduct(null);
                      }}
                      className="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-xs shadow"
                    >
                      Add {quickViewQty} to Basket →
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
